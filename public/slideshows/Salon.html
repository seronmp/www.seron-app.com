<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f8fafc;--ink:#1f2937;--brand:#3b82f6;--line:#e2e8f0;--media:#f1f5f9;--card:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--ink:#f1f5f9;--brand:#60a5fa;--line:#334155;--media:#1e293b;--card:#1e293b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(20px,3vw,30px);margin:14px 0 8px;text-align:center}
#stage{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px #0003}
.scene{position:absolute;inset:0;display:flex;opacity:0;transition:opacity .7s;pointer-events:none}
.scene.on{opacity:1}
.scene .txt{flex:0 0 38%;padding:4%;display:flex;flex-direction:column;justify-content:center;gap:10px}
.scene .step{color:var(--brand);font-size:clamp(11px,1.4vw,14px);letter-spacing:.12em;text-transform:uppercase}
.scene h2{font-family:Georgia,serif;font-weight:400;margin:0;font-size:clamp(20px,3.2vw,36px)}
.scene p{margin:0;font-size:clamp(12px,1.6vw,17px);line-height:1.5}
.scene .img{flex:1;display:flex;align-items:center;justify-content:center;padding:3%;background:var(--media)}
.scene img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 6px 24px #0003;transform:scale(1);transition:transform 9s linear}
.scene.on img{transform:scale(1.05)}
.scene.title{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--brand);color:#fff}
.scene.title .txt{flex:none;align-items:center}.scene.title .step{color:#fff}
#cap{width:min(100%,960px);margin:12px 0;padding:12px 16px;background:var(--card);border-radius:12px;font-size:clamp(13px,1.8vw,17px);line-height:1.5;min-height:3.6em}
#bar{width:min(100%,960px);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--brand)}
.ctl{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;justify-content:center}
button{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.languages{display:flex;gap:4px}
.languages button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
button:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style></head><body>

const S=[
{t:"Willkommen",h:"Termine per WhatsApp buchen",x:"Der Salon Manager ist Ihr digitaler Terminassistent: Kunden buchen einfach per WhatsApp, Sie behalten alles in einer übersichtlichen App im Blick.",title:1},
{t:"Schritt 1",h:"Anmelden",x:"Melden Sie sich als Admin oder Stylist mit E-Mail und Passwort an – oder bequem mit Ihrem Google-Konto.",i:1},
{t:"Schritt 2",h:"Der Kunde schreibt per WhatsApp",x:"Ihr Kunde schreibt einfach eine Nachricht, zum Beispiel: „Herrenschnitt morgen 10:30?“ Der Buchungsassistent antwortet sofort, fragt nur noch den Namen und bestätigt den Termin.",i:11},
{t:"Schritt 3",h:"Der Termin erscheint automatisch",x:"Sobald der Kunde bestätigt ist, steht der Termin in Ihrer Terminliste – mit Uhrzeit, Leistung, Name, Telefonnummer und Stylist. Die Erinnerung geht automatisch per WhatsApp an den Kunden.",i:4},
{t:"Schritt 4",h:"Die Agenda",x:"In der Agenda sehen Sie Ihren Tag, die Woche oder den ganzen Monat – auf Wunsch gefiltert nach Stylist. Neue Termine tragen Sie bei Bedarf auch selbst ein. Geschlossene Tage werden klar angezeigt.",i:3},
{t:"Einrichten",h:"Services und Preise",x:"Legen Sie Ihre Behandlungen mit Dauer und Preis an, zum Beispiel Herrenschnitt, Damenschnitt, Färben oder Extensions. Der Assistent bietet Kunden genau diese Leistungen an.",i:5},
{t:"Einrichten",h:"Ihr Team",x:"Hier verwalten Sie Ihre Stylisten. Jeder im Team kann eigene Termine haben, und Kunden können gezielt nach einem Stylisten fragen.",i:6},
{t:"Einrichten",h:"Öffnungszeiten",x:"Die Öffnungszeiten bestimmen, welche Termine frei sind. Legen Sie pro Wochentag fest, wann geöffnet ist, und wählen Sie den Abstand zwischen den Terminstarts, zum Beispiel 15 Minuten.",i:8},
{t:"Ihr Salon",h:"Stammdaten und Buchungs-Links",x:"Hinterlegen Sie Name, Adresse, Telefon, WhatsApp-Nummer und Ihre Markenfarbe. Zusätzlich erhalten Sie Links zum Teilen: eine eigene Salon-Seite und einen Buchungs-Chat.",i:7},
{t:"Ihr Salon",h:"Der Buchungs-Chat im Browser",x:"Wer lieber nicht WhatsApp nutzt, bucht über den Buchungs-Chat im Browser – auf Deutsch, Italienisch oder Englisch, in Ihren Salonfarben.",i:10},
{t:"Marketing",h:"QR-Code und Flyer",x:"Im Marketing-Kit finden Sie Ihren QR-Code. Kunden scannen ihn und landen direkt in einem vorausgefüllten WhatsApp-Chat mit Ihrem Salon. Den Werbetext können Sie selbst schreiben oder mit KI vorschlagen lassen – und alles als PDF herunterladen.",i:9},
{t:"Fertig",h:"Mehr Zeit für das Wesentliche",x:"Der Salon Manager nimmt Termine rund um die Uhr entgegen, verschickt Erinnerungen und hält Ihre Agenda aktuell. Sie kümmern sich um Ihre Kunden. Viel Erfolg!",title:1}
];
const DE=S.map(({t,h,x})=>({t,h,x}));
const IT=[
{t:'Benvenuti',h:'Prenota gli appuntamenti su WhatsApp',x:'Salon Manager è il tuo assistente digitale per gli appuntamenti: i clienti prenotano direttamente su WhatsApp e tu gestisci tutto da un’app semplice e ordinata.'},
{t:'Passaggio 1',h:'Accedi',x:'Accedi come amministratore o stylist con e-mail e password, oppure in modo pratico con il tuo account Google.'},
{t:'Passaggio 2',h:'Il cliente scrive su WhatsApp',x:'Il cliente invia un messaggio, per esempio: “Taglio uomo domani alle 10:30?”. L’assistente risponde subito, chiede il nome e conferma l’appuntamento.'},
{t:'Passaggio 3',h:'L’appuntamento viene aggiunto automaticamente',x:'Dopo la conferma del cliente, l’appuntamento appare nell’agenda con orario, servizio, nome, telefono e stylist. Il promemoria viene inviato automaticamente su WhatsApp.'},
{t:'Passaggio 4',h:'L’agenda',x:'Nell’agenda puoi visualizzare la giornata, la settimana o il mese e filtrare gli appuntamenti per stylist. Se serve, puoi inserire un appuntamento anche manualmente. I giorni di chiusura sono indicati chiaramente.'},
{t:'Configurazione',h:'Servizi e prezzi',x:'Crea i tuoi servizi indicando durata e prezzo, per esempio taglio uomo, taglio donna, colore o extension. L’assistente proporrà ai clienti i servizi che hai configurato.'},
{t:'Configurazione',h:'Il tuo team',x:'Gestisci qui i tuoi stylist. Ogni membro del team può avere la propria agenda e i clienti possono chiedere un appuntamento con una persona specifica.'},
{t:'Configurazione',h:'Orari di apertura',x:'Gli orari di apertura determinano gli appuntamenti disponibili. Imposta gli orari per ogni giorno della settimana e scegli l’intervallo tra gli appuntamenti, per esempio quindici minuti.'},
{t:'Il tuo salone',h:'Dati del salone e link di prenotazione',x:'Inserisci nome, indirizzo, telefono, numero WhatsApp e colore del marchio. Riceverai anche link da condividere: una pagina dedicata al salone e una chat per le prenotazioni.'},
{t:'Il tuo salone',h:'La chat di prenotazione nel browser',x:'Chi preferisce non usare WhatsApp può prenotare tramite la chat nel browser, disponibile in tedesco, italiano e inglese e personalizzata con i colori del salone.'},
{t:'Promozione',h:'Codice QR e volantini',x:'Nel kit promozionale trovi il tuo codice QR. I clienti lo scansionano e aprono una chat WhatsApp con un messaggio già pronto per il tuo salone. Puoi scrivere il testo promozionale o fartelo suggerire dall’IA, poi scaricare tutto in PDF.'},
{t:'Fatto',h:'Più tempo per ciò che conta',x:'Salon Manager riceve appuntamenti a qualsiasi ora, invia promemoria e mantiene aggiornata l’agenda. Tu puoi dedicarti ai tuoi clienti. Buon lavoro!'}
];
let lang='de';
const stage=document.getElementById('stage'),cap=document.getElementById('cap'),bar=document.querySelector('#bar i');
S.forEach(s=>{const d=document.createElement('div');d.className='scene'+(s.title?' title':'');
d.innerHTML=`<div class="txt"><div class="step">${s.t}</div><h2>${s.h}</h2>${s.title?'':''}</div>`+(s.i?`<div class="img"><img src="${IMG[s.i]}" alt="${s.h}"></div>`:'');
if(!s.title){d.querySelector('.txt').insertAdjacentHTML('beforeend','<p>'+s.x.split('. ')[0].replace(/\.$/,'')+'.</p>')}
stage.appendChild(d)});
const sc=[...document.querySelectorAll('.scene')];let cur=0,playing=false,voice=false,timer=null,t0=0,dur=8000;
const synth=window.speechSynthesis;
function playLabel(isPlaying){return isPlaying?(lang==='it'?'⏸ Pausa':'⏸ Pause'):(lang==='it'?'▶ Riproduci':'▶ Abspielen')}
function show(n){cur=(n+S.length)%S.length;sc.forEach((e,i)=>e.classList.toggle('on',i===cur));cap.textContent=S[cur].x;
 dur=Math.max(7000,S[cur].x.length*75);bar.style.transition='none';bar.style.width='0';
 clearTimeout(timer);try{synth&&synth.cancel()}catch(e){}
 if(voice&&synth){const u=new SpeechSynthesisUtterance(S[cur].x);u.lang=lang==='it'?'it-IT':'de-DE';u.rate=.95;const v=best();if(v)u.voice=v;u.onend=()=>{if(playing)timer=setTimeout(()=>cur<S.length-1?show(cur+1):stop(),900)};synth.speak(u);
  if(playing){bar.style.transition='width '+dur+'ms linear';requestAnimationFrame(()=>bar.style.width='100%')}return}
 if(playing){requestAnimationFrame(()=>{bar.style.transition='width '+dur+'ms linear';bar.style.width='100%'});timer=setTimeout(()=>cur<S.length-1?show(cur+1):stop(),dur)}}
function stop(){playing=false;clearTimeout(timer);try{synth&&synth.cancel()}catch(e){}document.getElementById('play').textContent=playLabel(false)}
document.getElementById('play').onclick=()=>{if(playing){stop();return}playing=true;document.getElementById('play').textContent=playLabel(true);show(cur)};
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('voice').onclick=e=>{voice=!voice;e.target.textContent=lang==='it'?'🔊 Voce: '+(voice?'attiva':'disattivata'):'🔊 Sprecher: '+(voice?'ein':'aus');if(playing)show(cur)};
const vsel=document.getElementById('vsel');
function dv(){return synth?synth.getVoices().filter(v=>new RegExp('^'+lang,'i').test(v.lang)):[]}
function score(v){const n=v.name;return (/natural|neural/i.test(n)?4:0)+(/online/i.test(n)?2:0)+(/google|microsoft|apple|siri|premium|enhanced/i.test(n)?1:0)}
function ranked(){return dv().sort((a,b)=>score(b)-score(a))}
function best(){const l=ranked();return l.find(v=>v.name===vsel.value)||l[0]}
function fill(){const keep=vsel.value;vsel.innerHTML=ranked().map(v=>'<option>'+v.name+'</option>').join('');if(keep)vsel.value=keep;vsel.style.display=vsel.options.length?'':'none'}
function setLanguage(next){
const wasPlaying=playing;if(wasPlaying){playing=false;clearTimeout(timer);try{synth&&synth.cancel()}catch(e){}}
lang=next;S.forEach((slide,i)=>Object.assign(slide,next==='it'?IT[i]:DE[i]));
document.documentElement.lang=next;document.title=next==='it'?'Salon Manager – Presentazione':'Salon Manager – Erklärvideo';
document.getElementById('page-title').textContent=next==='it'?'Salon Manager – ecco come funziona':'Salon Manager – so funktioniert’s';
document.getElementById('voice').textContent=next==='it'?'🔊 Voce: '+(voice?'attiva':'disattivata'):'🔊 Sprecher: '+(voice?'ein':'aus');
document.getElementById('vsel').title=next==='it'?'Scegli la voce':'Stimme wählen';
document.getElementById('prev').setAttribute('aria-label',next==='it'?'Indietro':'Zurück');document.getElementById('next').setAttribute('aria-label',next==='it'?'Avanti':'Weiter');
document.getElementById('lang-de').setAttribute('aria-pressed',String(next==='de'));document.getElementById('lang-it').setAttribute('aria-pressed',String(next==='it'));
sc.forEach((el,i)=>{el.querySelector('.step').textContent=S[i].t;el.querySelector('h2').textContent=S[i].h;const p=el.querySelector('p');if(p)p.textContent=S[i].x.split('. ')[0].replace(/\.$/,'')+'.';const img=el.querySelector('img');if(img)img.alt=S[i].h});
fill();cap.textContent=S[cur].x;document.getElementById('play').textContent=playLabel(playing);if(wasPlaying){playing=true;show(cur)}
}
if(synth){synth.onvoiceschanged=fill}fill();
document.getElementById('lang-de').onclick=()=>setLanguage('de');document.getElementById('lang-it').onclick=()=>setLanguage('it');
vsel.onchange=()=>{if(voice&&playing)show(cur)};
show(0);
</script></body></html>
