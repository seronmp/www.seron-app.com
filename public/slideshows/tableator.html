<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableator – Erklärvideo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f8fafc;--ink:#1f2937;--mut:#64748b;--acc:#6366f1;--ok:#2563eb;--pan:#ffffff;--ln:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--ink:#f1f5f9;--mut:#94a3b8;--acc:#818cf8;--ok:#60a5fa;--pan:#1e293b;--ln:#334155}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.wrap{width:100%;max-width:1180px}
.stage{position:relative;aspect-ratio:16/9;background:var(--pan);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.sc{position:absolute;inset:0;display:grid;grid-template-columns:5fr 7fr;gap:4%;align-items:center;padding:5%;opacity:0;pointer-events:none;transition:opacity .5s}
.sc.on{opacity:1;pointer-events:auto}
.sc.solo{grid-template-columns:1fr;text-align:left}
.sc h2{font-size:clamp(22px,4.2vw,58px);line-height:1.02;margin:0 0 .4em;font-weight:800;letter-spacing:-.02em;color:var(--acc)}
.sc.solo h2{font-size:clamp(34px,8vw,110px)}
.sc p{margin:0;color:var(--mut);font-size:clamp(12px,1.7vw,22px);line-height:1.35;max-width:34ch}
.sc.solo p{max-width:48ch}
.frame{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:6px;max-height:100%;display:flex}
.frame img{width:100%;height:auto;max-height:68%;object-fit:contain;border-radius:4px;display:block;margin:auto}
.frame{align-self:center}
.sub{position:absolute;left:5%;right:5%;bottom:3.5%;background:rgba(30,41,59,.92);color:#fff;border-radius:6px;padding:.6em .9em;font-size:clamp(11px,1.5vw,19px);line-height:1.35;text-align:center;opacity:0;transition:opacity .3s}
.sub.on{opacity:1}
.bar{height:5px;background:var(--ln);border-radius:3px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.languages{display:flex;gap:4px}
.languages button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button,select{font:inherit;font-size:15px;border:1px solid var(--ln);background:var(--pan);color:var(--ink);padding:.55em 1em;border-radius:6px;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:focus-visible,select:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.note{color:var(--mut);font-size:14px;line-height:1.45;margin:12px 0 0}
.cnt{margin-left:auto;color:var(--mut);font-size:14px}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:5}
.start.off{display:none}
.start button{font-size:20px;padding:.8em 1.6em}
@media(max-width:640px){.sc{grid-template-columns:1fr;gap:2%;align-content:start;padding:4%}.sc p{display:none}.frame img{max-height:none}.sub{font-size:11px}}
@media(prefers-reduced-motion:reduce){.sc,.sub,.bar i{transition:none}}
a.btn{display:inline-flex;align-items:center;font:inherit;font-size:15px;border:1px solid var(--ln);background:var(--pan);color:var(--ink);padding:.55em 1em;border-radius:6px;text-decoration:none}
.frame{min-height:0}
.frame img{object-fit:contain}
@media (max-width:700px) and (orientation:portrait){
body{padding:10px}
.stage{aspect-ratio:auto;height:min(74svh,760px)}
.sc{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:8px;align-content:stretch;padding:12px}
.sc.solo{grid-template-rows:1fr;align-content:center}
.sc h2{font-size:clamp(20px,6vw,28px);margin:0}
.sc.solo h2{font-size:clamp(30px,9vw,44px)}
.sc p{display:none}
.frame{padding:3px;height:100%;max-height:none}
.frame img{width:100%;height:100%;max-height:none}
.sc{bottom:26%}
.sub{left:0;right:0;bottom:0;height:26%;border-radius:0;overflow:auto;display:flex;align-items:center;justify-content:center;font-size:14px}
}
@media (orientation:landscape) and (max-height:520px){
body{padding:6px 8px}
.wrap{max-width:none}
.stage{aspect-ratio:auto;height:calc(100svh - 110px);min-height:200px}
.sc{grid-template-columns:30fr 70fr;gap:2%;padding:2%}
.sc.solo{grid-template-columns:1fr}
.sc h2{font-size:clamp(16px,3.6vw,28px)}
.sc p{display:none}
.frame{height:100%;padding:3px}
.frame img{width:100%;height:100%;max-height:none}
.sub{bottom:2%;font-size:12px;padding:.3em .6em}
.bar{margin:6px 0}
.note{display:none}
button,select,a.btn{padding:.35em .8em}
}
</style></head><body>
<div class="wrap">
<div class="stage" id="stage">
<div class="start" id="start"><button class="main" id="go">▶ Video starten (mit Ton)</button></div>
<div class="sub" id="sub"></div>
</div>
<div class="bar"><i id="pg"></i></div>
<div class="ctl">
<div class="languages" role="group" aria-label="Sprache wählen"><button id="lang-de" type="button" aria-pressed="true">DE</button><button id="lang-it" type="button" aria-pressed="false">IT</button></div>
<a class="btn" id="home" href="/tableator-de">🏠 Start</a>
<button id="prev" aria-label="Zurück">⏮</button>
<button id="pp" class="main">⏸ Pause</button>
<button id="next" aria-label="Weiter">⏭</button>
<span class="cnt" id="cnt"></span>
</div>
<p class="note" id="note"></p>
</div>

 Browser öffnen, E-Mail und Passwort eingeben", "n": "Sie melden sich einfach mit E-Mail und Passwort an. Kein Download, keine Installation: im Browser öffnen, fertig."}, {"k": "plan", "t": "Der interaktive Raumplan", "s": "Tag im Kalender wählen, Saal wählen, Tisch anklicken", "n": "Das Herzstück ist der interaktive Raumplan. Im Kalender wählen Sie den Tag, oben den Saal, zum Beispiel Hauptsaal oder Veranda. Jeder Tisch zeigt per Farbe, ob er frei, teilweise besetzt oder voll ist. Ein Klick auf den Tisch, und Sie reservieren."}, {"k": "res", "t": "Alle Gäste des Tages", "s": "Uhrzeit, Tisch, Name, Personen, Telefon – freie Plätze auf einen Blick", "n": "In der Tagesübersicht sehen Sie alle Reservierungen mit Uhrzeit, Tisch, Name, Personenzahl und Telefonnummer. Oben stehen freie Plätze und reservierte Gäste. Den Tisch tauschen Sie direkt in der Liste, stornierte Reservierungen stellen Sie mit einem Klick wieder her."}, {"k": "edit", "t": "Ihr Lokal, genau nachgebaut", "s": "Tische verschieben, drehen, Plätze ändern, Wände und Türen zeichnen", "n": "Ihren Raum bauen Sie selbst nach. Im Bearbeitungsmodus verschieben, drehen und vergrößern Sie Tische, ändern die Sitzplätze und zeichnen Wände, Türen und Durchgänge. Neue Säle legen Sie mit einem Klick an."}, {"k": "wa", "t": "Der WhatsApp-Assistent", "s": "„1“ für Tischreservierung, „2“ für Bestellung", "n": "Jetzt zum WhatsApp-Assistenten. Schreibt ein Gast Ihrem Restaurant, antwortet der Bot automatisch: Antworte mit eins für eine Tischreservierung, oder mit zwei für eine Bestellung. Ihre Gäste müssen nichts installieren, und Sie müssen nicht ans Telefon."}, {"k": "wa", "t": "Alle Chats an einem Ort", "s": "Schnellantworten auf Deutsch und Italienisch", "n": "Im Posteingang sehen Sie alle Kundenchats gesammelt. Sobald Sie persönlich antworten, hält sich der Bot vierundzwanzig Stunden zurück. Mit den Schnellantworten, zum Beispiel: Deine Pizza ist in zehn Minuten abholbereit, antworten Sie mit einem Klick, auf Deutsch und auf Italienisch."}, {"k": "ord", "t": "Bestellungen mit Abhol-Countdown", "s": "Eingang · Abholzeit senden · als abgeholt markieren", "n": "Eingehende Bestellungen erscheinen sofort in der Bestellliste. Sobald Sie die Abholzeit senden, startet automatisch ein Countdown. Ist die Pizza abgeholt, markieren Sie die Bestellung mit einem Klick als erledigt."}, {"k": null, "t": "Tableator ausprobieren", "s": "seron-app.com/tableator", "n": "Tableator: ein digitales Reservierungsbuch und ein WhatsApp-Assistent, zweisprachig auf Italienisch und Deutsch. Mehr erfahren Sie auf seron-app punkt com, Schrägstrich tableator. Probieren Sie es aus!"}];

const IT=[
{t:'Tableator',s:'Il registro digitale delle prenotazioni con assistente WhatsApp',n:'Benvenuti in Tableator, il registro digitale delle prenotazioni per ristoranti e pizzerie. In questo breve video vi mostro le funzioni principali.'},
{t:'Tutto in un unico posto',s:'Registro digitale su tablet o computer · assistente WhatsApp per tavoli e ordini',n:'Basta con il registro cartaceo. Tableator funziona su tablet e computer, mentre l’assistente WhatsApp riceve prenotazioni e ordini a qualsiasi ora. Tutto è raccolto in un unico posto.'},
{t:'Accedi e inizia',s:'Apri il browser, inserisci e-mail e password',n:'Accedi facilmente con e-mail e password. Nessun download e nessuna installazione: apri il browser e sei pronto.'},
{t:'La mappa interattiva del locale',s:'Scegli il giorno, la sala e poi il tavolo',n:'Il cuore del sistema è la mappa interattiva del locale. Scegli il giorno nel calendario e la sala in alto, per esempio la sala principale o la veranda. Il colore di ogni tavolo indica se è libero, parzialmente occupato o pieno. Tocca un tavolo per effettuare una prenotazione.'},
{t:'Tutti gli ospiti della giornata',s:'Orario, tavolo, nome, persone e telefono: i posti liberi a colpo d’occhio',n:'Nel riepilogo giornaliero trovi tutte le prenotazioni con orario, tavolo, nome, numero di persone e telefono. In alto vedi i posti liberi e gli ospiti prenotati. Puoi cambiare tavolo direttamente dall’elenco e ripristinare una prenotazione annullata con un clic.'},
{t:'Il tuo locale, ricreato fedelmente',s:'Sposta e ruota i tavoli, modifica i posti e disegna pareti e porte',n:'Puoi ricreare la planimetria del tuo locale. In modalità modifica sposti, ruoti e ridimensioni i tavoli, cambi il numero di posti e disegni pareti, porte e passaggi. Puoi aggiungere nuove sale con un clic.'},
{t:'L’assistente WhatsApp',s:'“1” per prenotare un tavolo, “2” per ordinare',n:'Ecco l’assistente WhatsApp. Quando un cliente scrive al ristorante, il bot risponde automaticamente: digita uno per prenotare un tavolo oppure due per ordinare. I clienti non devono installare nulla e tu non devi rispondere al telefono.'},

];
let lang='de';
const stage=document.getElementById('stage'),sub=document.getElementById('sub');
const els=SC.map((s,i)=>{const d=document.createElement('section');d.className='sc'+(s.k?'':' solo');
d.innerHTML='<div><h2></h2><p></p></div>'+(s.k?'<div class="frame"><img alt=""></div>':'');
d.querySelector('h2').textContent=s.t;d.querySelector('p').textContent=s.s;
if(s.k){const im=d.querySelector('img');im.src=IMGS[s.k];im.alt=s.t}
stage.insertBefore(d,sub);return d});
let cur=0,playing=false,tok=0,voices=[],timer=null;
const synth=window.speechSynthesis;
function pick(){const l=synth?synth.getVoices().filter(v=>new RegExp('^'+lang,'i').test(v.lang)):[];
const g=l.find(v=>/google/i.test(v.name))||l.find(v=>/natural|neural|online/i.test(v.name))||l[0];voices=g?[g]:[];
const n=document.getElementById('note');
n.textContent=lang==='it'?(/google/i.test(g&&g.name)?'':'Suggerimento: in Google Chrome è disponibile la voce “Google italiano”.'):(/google/i.test(g&&g.name)?'':'Tipp: In Google Chrome steht die Stimme „Google Deutsch“ zur Verfügung.');}
if(synth){pick();synth.onvoiceschanged=pick}
function show(i){cur=i;els.forEach((e,j)=>e.classList.toggle('on',j===i));
document.getElementById('pg').style.width=((i+1)/SC.length*100)+'%';
document.getElementById('cnt').textContent=(i+1)+' / '+SC.length}
function setLanguage(next){
const wasPlaying=playing;playing=false;tok++;clearTimeout(timer);synth&&synth.cancel();lang=next;
SC.forEach((slide,i)=>Object.assign(slide,next==='it'?IT[i]:DE[i]));
els.forEach((el,i)=>{el.querySelector('h2').textContent=SC[i].t;el.querySelector('p').textContent=SC[i].s;const img=el.querySelector('img');if(img)img.alt=SC[i].t});
document.documentElement.lang=next;document.title=next==='it'?'Tableator – Presentazione':'Tableator – Erklärvideo';
document.getElementById('go').textContent=next==='it'?'▶ Avvia il video con audio':'▶ Video starten (mit Ton)';
document.getElementById('prev').setAttribute('aria-label',next==='it'?'Indietro':'Zurück');document.getElementById('next').setAttribute('aria-label',next==='it'?'Avanti':'Weiter');
const home=document.getElementById('home');home.href=next==='it'?'/tableator':'/tableator-de';home.textContent=next==='it'?'🏠 Home':'🏠 Start';
document.getElementById('lang-de').setAttribute('aria-pressed',String(next==='de'));document.getElementById('lang-it').setAttribute('aria-pressed',String(next==='it'));
if(sub.classList.contains('on'))sub.textContent=SC[cur].n;show(cur);pick();setPP();if(wasPlaying){playing=true;setPP();speak(cur)}
}
function speak(i){const my=++tok;clearTimeout(timer);synth&&synth.cancel();show(i);
sub.textContent=SC[i].n;sub.classList.add('on');
const next=()=>{if(my!==tok||!playing)return;if(i<SC.length-1)speak(i+1);else{playing=false;sub.classList.remove('on');setPP()}};
if(!synth||!voices.length){timer=setTimeout(next,Math.max(5000,SC[i].n.length*70));return}
const u=new SpeechSynthesisUtterance(SC[i].n);const v=voices[0];
if(v)u.voice=v;u.lang=lang==='it'?'it-IT':'de-DE';u.rate=1;
u.onend=()=>{timer=setTimeout(next,700)};u.onerror=()=>{timer=setTimeout(next,1500)};
synth.speak(u)}
function setPP(){document.getElementById('pp').textContent=playing?(lang==='it'?'⏸ Pausa':'⏸ Pause'):(lang==='it'?'▶ Continua':'▶ Weiter')}
document.getElementById('go').onclick=()=>{document.getElementById('start').classList.add('off');playing=true;setPP();speak(0)};
document.getElementById('pp').onclick=()=>{if(playing){playing=false;tok++;clearTimeout(timer);synth&&synth.cancel();setPP()}else{playing=true;setPP();document.getElementById('start').classList.add('off');speak(cur)}};
document.getElementById('prev').onclick=()=>{playing=true;setPP();speak(Math.max(0,cur-1))};
document.getElementById('next').onclick=()=>{playing=true;setPP();speak(Math.min(SC.length-1,cur+1))};
document.getElementById('lang-de').onclick=()=>setLanguage('de');document.getElementById('lang-it').onclick=()=>setLanguage('it');
show(0);
</script></body></html>
