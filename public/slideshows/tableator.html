<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tableator &amp; WhataPizza – Erklärvideo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #f8fafc;
      --ink: #1f2937;
      --muted: #64748b;
      --brand: #3b204b;
      --brand-light: #4b295f;
      --panel: #fff;
      --line: #e2e8f0;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      background:
        radial-gradient(circle at 10% 10%, rgba(59, 32, 75, .10), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(59, 32, 75, .08), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid #9c72b0;
      outline-offset: 3px;
    }
    .wrap { width: min(1180px, 100%); margin: 0 auto; }
    .stage {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(59, 32, 75, .14);
    }
    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 4%;
      align-items: center;
      padding: 5%;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .45s ease, transform .45s ease;
    }
    .slide.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .slide.text-only {
      grid-template-columns: 1fr;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(59, 32, 75, .05), transparent 50%),
        var(--panel);
    }
    .eyebrow {
      margin: 0 0 .8em;
      color: var(--brand);
      font-size: clamp(11px, 1.2vw, 16px);
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1, h2 {
      margin: 0 0 .35em;
      color: var(--brand);
      font-size: clamp(30px, 4.3vw, 60px);
      line-height: 1;
      letter-spacing: -.035em;
    }
    .text-only h1, .text-only h2 { font-size: clamp(38px, 7vw, 88px); }
    .description {
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.65vw, 22px);
      line-height: 1.42;
    }
    .text-only .description { max-width: 48ch; margin-inline: auto; }
    .product-logo {
      display: block;
      width: min(250px, 55%);
      height: auto;
      margin: 0 auto 1.8em;
      object-fit: contain;
    }
    .frame {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: 100%;
      padding: 8px;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, .10);
    }
    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .subtitle {
      position: absolute;
      right: 4%;
      bottom: 3%;
      left: 4%;
      z-index: 3;
      padding: .75em 1em;
      color: white;
      background: rgba(36, 22, 43, .93);
      border-radius: 10px;
      font-size: clamp(11px, 1.4vw, 18px);
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
    }
    .subtitle.is-visible { opacity: 1; transform: translateY(0); }
    .start {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(23, 15, 27, .38);
      backdrop-filter: blur(2px);
    }
    .start.is-hidden { display: none; }
    .progress {
      height: 6px;
      margin: 12px 0;
      overflow: hidden;
      background: var(--line);
      border-radius: 999px;
    }
    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--brand);
      transition: width .35s;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .language { display: flex; gap: 5px; }
    button, .home {
      min-height: 42px;
      padding: .55em 1em;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
      text-decoration: none;
    }
    button.primary {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
      font-weight: 800;
    }
    button.primary:hover { background: var(--brand-light); border-color: var(--brand-light); }
    button[aria-pressed="true"] {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
    }
    .count { margin-left: auto; color: var(--muted); font-size: 14px; }
    .note { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    @media (max-width: 700px) {
      body { padding: 10px; }
      .stage { height: min(76svh, 760px); aspect-ratio: auto; border-radius: 12px; }
      .slide {
        grid-template: auto minmax(0, 1fr) / 1fr;
        gap: 10px;
        padding: 18px 12px 29%;
      }
      .slide h2 { margin-bottom: 0; font-size: clamp(24px, 7vw, 34px); }
      .slide .description, .eyebrow { display: none; }
      .slide.text-only { padding: 12% 7% 29%; align-content: center; }
      .slide.text-only .description, .slide.text-only .eyebrow { display: block; }
      .slide.text-only h1, .slide.text-only h2 { font-size: clamp(38px, 12vw, 64px); }
      .frame { padding: 4px; }
      .subtitle {
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 25%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0;
        font-size: 14px;
      }
      button, .home { min-height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide, .subtitle, .progress > span { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="stage" id="stage" aria-live="polite">
      <div class="subtitle" id="subtitle"></div>
      <div class="start" id="start">
        <button class="primary" id="start-button" type="button">▶ Video starten (mit Ton)</button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <nav class="controls" aria-label="Videosteuerung">
      <div class="language" role="group" aria-label="Sprache wählen">
        <button id="language-de" type="button" aria-pressed="true">DE</button>
        <button id="language-it" type="button" aria-pressed="false">IT</button>
      </div>
      <a class="home" id="home-link" href="/tableator-de">⌂ Start</a>
      <button id="previous" type="button" aria-label="Zurück">⏮</button>
      <button class="primary" id="play-pause" type="button">⏸ Pause</button>
      <button id="next" type="button" aria-label="Weiter">⏭</button>
      <span class="count" id="count"></span>
    </nav>
    <p class="note" id="voice-note"></p>
  </main>

  <script>
    const imagePath = '/slideshows/tableator-images/';
    const content = {
      de: [
        { logo: true, eyebrow: 'Tableator & WhataPizza', title: 'Reservierungen. Chats. Bestellungen.', description: 'Eine Plattform für den gesamten Restaurantbetrieb.', narration: 'Willkommen zur neuen Tableator-Präsentation. Reservierungen, WhatsApp-Kommunikation und Bestellungen arbeiten jetzt in einer einzigen Plattform zusammen.' },
        { title: 'Der bestehende Arbeitsablauf', description: 'Tischplan, Reservierungen, Gästeübersicht und WhatsApp-Assistent bleiben der Mittelpunkt.', narration: 'Die bewährten Funktionen bleiben erhalten: interaktiver Tischplan, Tagesübersicht, flexible Reservierungen und der WhatsApp-Assistent.' },
        { image: 'login.jpg', eyebrow: 'Sofort einsatzbereit', title: 'Im Browser anmelden', description: 'E-Mail eingeben, Passwort eingeben, starten – ohne Installation.', narration: 'Tableator öffnen Sie direkt im Browser. Sie melden sich mit E-Mail und Passwort an. Eine Installation ist nicht nötig.' },
        { image: 'plan.jpg', eyebrow: 'Reservierungen', title: 'Der interaktive Raumplan', description: 'Tag, Saal und Tisch auswählen. Freie und belegte Plätze auf einen Blick erkennen.', narration: 'Der interaktive Raumplan zeigt freie, teilweise belegte und volle Tische. Sie wählen Datum und Saal und nehmen die Reservierung direkt am Tisch vor.' },
        { image: 'res.jpg', eyebrow: 'Tagesübersicht', title: 'Alle Gäste an einem Ort', description: 'Uhrzeit, Tisch, Name, Personen und Telefon in einer übersichtlichen Liste.', narration: 'In der Tagesübersicht sehen Sie alle Gäste mit Uhrzeit, Tisch, Personenzahl und Kontaktdaten. Sie können Tische ändern und stornierte Reservierungen wiederherstellen.' },
        { image: 'edit.jpg', eyebrow: 'Flexible Einrichtung', title: 'Das eigene Lokal nachbauen', description: 'Tische verschieben und drehen, Plätze ändern sowie Wände und Durchgänge anlegen.', narration: 'Im Bearbeitungsmodus bilden Sie Ihr Lokal genau nach. Tische lassen sich verschieben, drehen und vergrößern. Auch Wände, Türen und zusätzliche Räume sind konfigurierbar.' },
        { image: 'wa.jpg', eyebrow: 'WhatsApp-Assistent', title: 'Bestellen und reservieren rund um die Uhr', description: 'Der Assistent sammelt Daten, prüft die Verfügbarkeit und bestätigt die Anfrage.', narration: 'Gäste können per WhatsApp einen Tisch reservieren oder eine Bestellung senden. Der Assistent fragt fehlende Angaben ab und übernimmt die Anfrage automatisch.' },
        { image: 'whatspizza-overview.png', logo: true, eyebrow: 'Neue WhataPizza-Oberfläche', title: 'Chats und Bestellungen in einer Ansicht', description: 'Kundennachrichten, Schnellantworten, Bestellstatus und Kalender bleiben ständig sichtbar.', narration: 'Neu ist die gemeinsame Arbeitsfläche. Links sehen Sie Kunden und Chat. Rechts bleiben Reservierungsstatus und Kalender sichtbar. Oben steuern Sie aktive Kunden, Funktionen und die Sprache.' },
        { image: 'whatspizza-orders.png', eyebrow: 'Neue Bestellverwaltung', title: 'Chat, Termin und Countdown', description: 'Nachrichten beantworten, Abholzeit festlegen und den Kundenstatus live verfolgen.', narration: 'Bei jeder Bestellung sehen Sie den vollständigen Chat und den Bestellstatus. Nach dem Versand der Abholzeit beginnt der Countdown. Schnellantworten beschleunigen die Kommunikation in Deutsch und Italienisch.' },
        { image: 'whatspizza-pickup.png', eyebrow: 'Abholung', title: 'Mit einem Klick abschließen', description: 'Der Bestellstatus wechselt übersichtlich von „offen“ über „zubereiten“ bis „abgeholt“.', narration: 'Die Bestellung bleibt übersichtlich im Tagesgeschäft. Ist die Ware abgeholt, drücken Sie auf Als abgeholt markieren und schließen den Auftrag mit einem Klick ab.' },
        { image: 'whatspizza-receipt.png', eyebrow: 'Druckbon', title: 'Restaurantbon für die Küche', description: 'Bestellnummer, Kunde, Artikel und eindeutige Abholzeit sauber formatiert drucken.', narration: 'Für die Küche entsteht ein klarer Restaurantbon. Er enthält Bestellnummer, Kundennamen, Artikel, Abholzeit und Zeitstempel. So bleibt jede Bestellung eindeutig zugeordnet.' },
        { logo: true, eyebrow: 'Bereit für Ihr Restaurant', title: 'Tableator mit WhataPizza', description: 'Digital reservieren, antworten, bestellen, zubereiten und abholen – alles an einem Ort.', narration: 'Tableator verbindet digitales Reservierungsbuch, WhatsApp-Assistent und WhataPizza-Bestellverwaltung. Jetzt auf seron-app punkt com, Schrägstrich tableator ausprobieren.' }
      ],
      it: [
        { logo: true, eyebrow: 'Tableator & WhataPizza', title: 'Prenotazioni. Chat. Ordini.', description: 'Un’unica piattaforma per la gestione completa del ristorante.', narration: 'Benvenuti nella nuova presentazione di Tableator. Prenotazioni, comunicazioni WhatsApp e ordini ora lavorano insieme in un’unica piattaforma.' },
        { title: 'Il flusso di lavoro esistente', description: 'Mappa dei tavoli, prenotazioni, riepilogo ospiti e assistente WhatsApp restano al centro.', narration: 'Le funzioni già conosciute restano disponibili: mappa interattiva, riepilogo giornaliero, prenotazioni flessibili e assistente WhatsApp.' },
        { image: 'login.jpg', eyebrow: 'Subito operativo', title: 'Accedi dal browser', description: 'Inserisci e-mail e password e inizia, senza installazione.', narration: 'Tableator si apre direttamente dal browser. Accedi con e-mail e password. Non è necessaria alcuna installazione.' },
        { image: 'plan.jpg', eyebrow: 'Prenotazioni', title: 'La mappa interattiva del locale', description: 'Scegli data, sala e tavolo. Vedi subito i posti liberi e quelli occupati.', narration: 'La mappa interattiva mostra i tavoli liberi, parzialmente occupati e completi. Scegli la data e la sala e registra la prenotazione direttamente dal tavolo.' },
        { image: 'res.jpg', eyebrow: 'Riepilogo giornaliero', title: 'Tutti gli ospiti in un unico posto', description: 'Orario, tavolo, nome, persone e telefono in un elenco chiaro.', narration: 'Nel riepilogo giornaliero trovi tutti gli ospiti con orario, tavolo, numero di persone e contatti. Puoi cambiare tavolo e ripristinare le prenotazioni annullate.' },
        { image: 'edit.jpg', eyebrow: 'Configurazione flessibile', title: 'Ricrea il tuo locale', description: 'Sposta e ruota i tavoli, cambia i posti e aggiungi pareti e passaggi.', narration: 'In modalità modifica ricrei fedelmente il locale. Puoi spostare, ruotare e ridimensionare i tavoli, aggiungere pareti, porte e nuove sale.' },
        { image: 'wa.jpg', eyebrow: 'Assistente WhatsApp', title: 'Prenota e ordina a qualsiasi ora', description: 'L’assistente raccoglie i dati, controlla la disponibilità e conferma la richiesta.', narration: 'Gli ospiti possono prenotare o inviare un ordine tramite WhatsApp. L’assistente richiede i dati mancanti e gestisce la richiesta automaticamente.' },
        { image: 'whatspizza-overview.png', logo: true, eyebrow: 'Nuova interfaccia WhataPizza', title: 'Chat e ordini in un’unica vista', description: 'Messaggi, risposte rapide, stato ordine e calendario sempre visibili.', narration: 'La nuova area di lavoro riunisce tutto. A sinistra trovi clienti e chat, a destra stato dell’ordine e calendario. In alto controlli clienti attivi, funzioni e lingua.' },
        { image: 'whatspizza-orders.png', eyebrow: 'Nuova gestione ordini', title: 'Chat, appuntamento e conto alla rovescia', description: 'Rispondi, definisci l’orario di ritiro e segui il cliente in tempo reale.', narration: 'Per ogni ordine vedi la conversazione completa e lo stato. Dopo aver inviato l’orario di ritiro parte il conto alla rovescia. Le risposte rapide velocizzano la comunicazione in italiano e tedesco.' },
        { image: 'whatspizza-pickup.png', eyebrow: 'Ritiro', title: 'Completa con un clic', description: 'Lo stato passa in modo chiaro da aperto a in preparazione e infine a ritirato.', narration: 'L’ordine resta sempre chiaro nel lavoro quotidiano. Quando il cliente ritira la merce, seleziona Contrassegna come ritirato e completa l’ordine con un clic.' },
        { image: 'whatspizza-receipt.png', eyebrow: 'Scontrino', title: 'Stampa per la cucina', description: 'Numero ordine, cliente, articoli e orario di ritiro in un formato leggibile.', narration: 'Per la cucina viene creato uno scontrino chiaro. Contiene numero ordine, nome cliente, articoli, orario di ritiro e data. Ogni ordine resta così identificabile.' },
        { logo: true, eyebrow: 'Pronto per il tuo ristorante', title: 'Tableator con WhataPizza', description: 'Prenota, rispondi, ordina, prepara e consegna in un unico posto.', narration: 'Tableator unisce registro digitale delle prenotazioni, assistente WhatsApp e gestione ordini WhataPizza. Scoprilo su seron-app punto com, barra tableator.' }
      ]
    };

    const stage = document.getElementById('stage');
    const subtitle = document.getElementById('subtitle');
    const startScreen = document.getElementById('start');
    const startButton = document.getElementById('start-button');
    const playPauseButton = document.getElementById('play-pause');
    const progress = document.getElementById('progress');
    const count = document.getElementById('count');
    const voiceNote = document.getElementById('voice-note');
    const previousButton = document.getElementById('previous');
    const nextButton = document.getElementById('next');
    const languageDe = document.getElementById('language-de');
    const languageIt = document.getElementById('language-it');
    const homeLink = document.getElementById('home-link');
    const synth = window.speechSynthesis;
    let language = 'de';
    let current = 0;
    let playing = false;
    let token = 0;
    let timer;

    const slideElements = content.de.map((_, index) => {
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.dataset.index = String(index);
      stage.insertBefore(slide, subtitle);
      return slide;
    });

    function selectedVoice() {
      if (!synth) return null;
      const matches = synth.getVoices().filter((voice) => new RegExp(`^${language}`, 'i').test(voice.lang));
      return matches.find((voice) => /google|natural|neural|online/i.test(voice.name)) || matches[0] || null;
    }

    function updateVoiceNote() {
      const voice = selectedVoice();
      const voiceReady = voice && /google|natural|neural|online/i.test(voice.name);
      voiceNote.textContent = voiceReady
        ? ''
        : language === 'de'
          ? 'Tipp: In Google Chrome oder Edge steht meist eine natürlichere deutsche Stimme zur Verfügung.'
          : 'Suggerimento: Google Chrome o Edge offrono solitamente una voce italiana più naturale.';
    }

    function renderSlides() {
      content[language].forEach((item, index) => {
        const slide = slideElements[index];
        slide.className = `slide${item.image ? '' : ' text-only'}`;
        const heading = index === 0 ? 'h1' : 'h2';
        slide.innerHTML = `
          <div>
            ${item.logo ? '<img class="product-logo" src="/WhataPizza_logo.png" alt="WhataPizza">' : ''}
            ${item.eyebrow ? `<p class="eyebrow">${item.eyebrow}</p>` : ''}
            <${heading}>${item.title}</${heading}>
            <p class="description">${item.description}</p>
          </div>
          ${item.image ? `<div class="frame"><img src="${imagePath}${item.image}" alt="${item.title}"></div>` : ''}
        `;
      });
    }

    function show(index) {
      current = Math.max(0, Math.min(index, slideElements.length - 1));
      slideElements.forEach((slide, slideIndex) => slide.classList.toggle('is-visible', slideIndex === current));
      progress.style.width = `${((current + 1) / slideElements.length) * 100}%`;
      count.textContent = `${current + 1} / ${slideElements.length}`;
    }

    function updatePlayButton() {
      playPauseButton.textContent = playing
        ? (language === 'de' ? '⏸ Pause' : '⏸ Pausa')
        : (language === 'de' ? '▶ Weiter' : '▶ Continua');
    }

    function stopSpeech() {
      token += 1;
      clearTimeout(timer);
      if (synth) synth.cancel();
    }

    function speak(index) {
      stopSpeech();
      show(index);
      if (!playing) return;

      const narration = content[language][current].narration;
      subtitle.textContent = narration;
      subtitle.classList.add('is-visible');
      const ownToken = token;
      const next = () => {
        if (!playing || ownToken !== token) return;
        if (current < slideElements.length - 1) {
          speak(current + 1);
        } else {
          playing = false;
          subtitle.classList.remove('is-visible');
          updatePlayButton();
        }
      };

      if (!synth || !selectedVoice()) {
        timer = setTimeout(next, Math.max(6500, narration.length * 62));
        return;
      }

      const utterance = new SpeechSynthesisUtterance(narration);
      utterance.voice = selectedVoice();
      utterance.lang = language === 'de' ? 'de-DE' : 'it-IT';
      utterance.rate = 1;
      utterance.onend = () => { timer = setTimeout(next, 650); };
      utterance.onerror = () => { timer = setTimeout(next, 1200); };
      synth.speak(utterance);
    }

    function setPlaying(value) {
      playing = value;
      startScreen.classList.add('is-hidden');
      updatePlayButton();
      if (playing) speak(current);
      else {
        stopSpeech();
        subtitle.classList.remove('is-visible');
      }
    }

    function setLanguage(nextLanguage) {
      const wasPlaying = playing;
      stopSpeech();
      playing = false;
      language = nextLanguage;
      document.documentElement.lang = language;
      document.title = language === 'de' ? 'Tableator & WhataPizza – Erklärvideo' : 'Tableator & WhataPizza – Presentazione';
      languageDe.setAttribute('aria-pressed', String(language === 'de'));
      languageIt.setAttribute('aria-pressed', String(language === 'it'));
      homeLink.href = language === 'de' ? '/tableator-de' : '/tableator';
      homeLink.textContent = language === 'de' ? '⌂ Start' : '⌂ Home';
      previousButton.setAttribute('aria-label', language === 'de' ? 'Zurück' : 'Indietro');
      nextButton.setAttribute('aria-label', language === 'de' ? 'Weiter' : 'Avanti');
      startButton.textContent = language === 'de' ? '▶ Video starten (mit Ton)' : '▶ Avvia il video con audio';
      renderSlides();
      show(current);
      updateVoiceNote();
      updatePlayButton();
      if (wasPlaying) setPlaying(true);
    }

    startButton.addEventListener('click', () => setPlaying(true));
    playPauseButton.addEventListener('click', () => setPlaying(!playing));
    previousButton.addEventListener('click', () => { playing = true; updatePlayButton(); speak(current - 1); });
    nextButton.addEventListener('click', () => { playing = true; updatePlayButton(); speak(current + 1); });
    languageDe.addEventListener('click', () => setLanguage('de'));
    languageIt.addEventListener('click', () => setLanguage('it'));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') previousButton.click();
      if (event.key === 'ArrowRight') nextButton.click();
      if (event.key === ' ' && event.target === document.body) {
        event.preventDefault();
        playPauseButton.click();
      }
    });
    if (synth) synth.addEventListener('voiceschanged', updateVoiceNote);

    renderSlides();
    show(0);
    updateVoiceNote();
    updatePlayButton();
  </script>
</body>
</html>
